<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Nuvoraq — powerful free online tools for PDF, images, files, text, developers and more."
  >

  <meta
    name="theme-color"
    content="#050816"
  >

  <title>Nuvoraq — Powerful Tools. One Simple Workspace.</title>

  <!-- =========================================================
       NUVORAQ — GLOBAL FOUNDATION
       PART 1
       ========================================================= -->

  <style>

    /* =========================================================
       01. DESIGN TOKENS
       ========================================================= */

    :root {

      /* ---------- Core colors ---------- */

      --nq-bg:
        #050816;

      --nq-bg-deep:
        #02030a;

      --nq-surface:
        rgba(12, 18, 38, 0.68);

      --nq-surface-solid:
        #0b1022;

      --nq-surface-soft:
        rgba(255, 255, 255, 0.035);

      --nq-border:
        rgba(255, 255, 255, 0.085);

      --nq-border-strong:
        rgba(255, 255, 255, 0.14);

      /* ---------- Brand ---------- */

      --nq-blue:
        #2457ff;

      --nq-blue-bright:
        #3674ff;

      --nq-indigo:
        #4f46e5;

      --nq-violet:
        #8b5cf6;

      --nq-purple:
        #a855f7;

      --nq-cyan:
        #38bdf8;

      /* ---------- Text ---------- */

      --nq-text:
        #f7f9ff;

      --nq-text-soft:
        #c4cbe0;

      --nq-text-muted:
        #8992ab;

      --nq-text-dim:
        #626b84;

      /* ---------- Effects ---------- */

      --nq-glow-blue:
        rgba(36, 87, 255, 0.30);

      --nq-glow-violet:
        rgba(139, 92, 246, 0.24);

      --nq-glow-cyan:
        rgba(56, 189, 248, 0.16);

      /* ---------- Layout ---------- */

      --nq-container:
        1240px;

      --nq-navbar-height:
        78px;

      --nq-radius-sm:
        10px;

      --nq-radius-md:
        16px;

      --nq-radius-lg:
        24px;

      --nq-radius-xl:
        32px;

      /* ---------- Motion ---------- */

      --nq-ease:
        cubic-bezier(0.22, 1, 0.36, 1);

      --nq-ease-soft:
        cubic-bezier(0.16, 1, 0.3, 1);

      --nq-transition:
        260ms var(--nq-ease);

      /* ---------- Typography ---------- */

      --nq-font:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --nq-font-display:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /* =========================================================
       02. LIGHT THEME TOKENS
       ========================================================= */

    html[data-theme="light"] {

      --nq-bg:
        #f5f7ff;

      --nq-bg-deep:
        #edf1fb;

      --nq-surface:
        rgba(255, 255, 255, 0.74);

      --nq-surface-solid:
        #ffffff;

      --nq-surface-soft:
        rgba(15, 23, 42, 0.035);

      --nq-border:
        rgba(15, 23, 42, 0.09);

      --nq-border-strong:
        rgba(15, 23, 42, 0.15);

      --nq-text:
        #10152a;

      --nq-text-soft:
        #3d4660;

      --nq-text-muted:
        #65708b;

      --nq-text-dim:
        #8992aa;

      --nq-glow-blue:
        rgba(36, 87, 255, 0.15);

      --nq-glow-violet:
        rgba(139, 92, 246, 0.12);

      --nq-glow-cyan:
        rgba(56, 189, 248, 0.10);
    }


    /* =========================================================
       03. RESET
       ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--nq-bg);
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family: var(--nq-font);

      color: var(--nq-text);
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(36, 87, 255, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 88% 8%,
          rgba(139, 92, 246, 0.08),
          transparent 26%
        ),
        var(--nq-bg);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      transition:
        background-color 400ms var(--nq-ease),
        color 400ms var(--nq-ease);
    }


    body.menu-open {
      overflow: hidden;
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    button {
      border: 0;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    img {
      max-width: 100%;
      display: block;
    }


    ::selection {
      color: #ffffff;
      background: rgba(79, 70, 229, 0.75);
    }


    /* =========================================================
       04. ACCESSIBILITY
       ========================================================= */

    :focus-visible {
      outline: 2px solid var(--nq-blue-bright);
      outline-offset: 4px;
    }


    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }


    /* =========================================================
       05. BACKGROUND ATMOSPHERE
       ========================================================= */

    .nq-background {
      position: fixed;
      inset: 0;

      z-index: -10;

      pointer-events: none;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.012),
          transparent 30%
        );
    }


    .nq-background::before {
      content: "";

      position: absolute;

      width: 620px;
      height: 620px;

      top: -320px;
      left: -220px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          var(--nq-glow-blue),
          transparent 68%
        );

      filter: blur(30px);

      animation:
        nqAmbientOne 14s ease-in-out infinite alternate;
    }


    .nq-background::after {
      content: "";

      position: absolute;

      width: 600px;
      height: 600px;

      top: -260px;
      right: -240px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          var(--nq-glow-violet),
          transparent 68%
        );

      filter: blur(35px);

      animation:
        nqAmbientTwo 17s ease-in-out infinite alternate;
    }


    @keyframes nqAmbientOne {

      0% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      100% {
        transform:
          translate3d(80px, 60px, 0)
          scale(1.12);
      }

    }


    @keyframes nqAmbientTwo {

      0% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      100% {
        transform:
          translate3d(-70px, 80px, 0)
          scale(1.10);
      }

    }


    /* =========================================================
       06. GLOBAL GRID TEXTURE
       ========================================================= */

    .nq-grid {
      position: fixed;
      inset: 0;

      z-index: -9;

      pointer-events: none;

      opacity: 0.18;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size:
        80px 80px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );

      -webkit-mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );
    }


    html[data-theme="light"] .nq-grid {
      opacity: 0.35;

      background-image:
        linear-gradient(
          rgba(15,23,42,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(15,23,42,0.035) 1px,
          transparent 1px
        );
    }


    /* =========================================================
       07. MAIN CONTAINER SYSTEM
       ========================================================= */

    .nq-container {
      width: min(
        calc(100% - 40px),
        var(--nq-container)
      );

      margin-inline: auto;
    }


    /* =========================================================
       08. NAVBAR SHELL
       ========================================================= */

    .nq-navbar-wrap {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        14px 20px;

      pointer-events: none;
    }


    .nq-navbar {

      width: min(
        calc(100% - 0px),
        1240px
      );

      height: var(--nq-navbar-height);

      margin-inline: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      padding:
        0 16px 0 20px;

      border:
        1px solid transparent;

      border-radius:
        20px;

      background:
        rgba(5, 8, 22, 0.16);

      backdrop-filter:
        blur(0px);

      -webkit-backdrop-filter:
        blur(0px);

      box-shadow:
        0 0 0 transparent;

      transition:
        height 380ms var(--nq-ease),
        background 380ms var(--nq-ease),
        border-color 380ms var(--nq-ease),
        box-shadow 380ms var(--nq-ease),
        backdrop-filter 380ms var(--nq-ease),
        transform 380ms var(--nq-ease);

      pointer-events: auto;
    }


    /* Scrolled navbar */

    .nq-navbar.is-scrolled {

      height: 68px;

      border-color:
        var(--nq-border);

      background:
        rgba(7, 11, 27, 0.72);

      backdrop-filter:
        blur(22px)
        saturate(140%);

      -webkit-backdrop-filter:
        blur(22px)
        saturate(140%);

      box-shadow:
        0 14px 45px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.035);
    }


    html[data-theme="light"] .nq-navbar.is-scrolled {

      background:
        rgba(255,255,255,0.78);

      box-shadow:
        0 14px 45px rgba(26, 35, 65, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }


    /* =========================================================
       09. BRAND
       ========================================================= */

    .nq-brand {

      display: inline-flex;

      align-items: center;

      flex:
        0 0 auto;

      position: relative;

      height: 48px;

      min-width: 160px;

      transition:
        transform var(--nq-transition);
    }


    .nq-brand:hover {
      transform:
        translateY(-1px);
    }


    .nq-brand-logo {

      width: 156px;

      height: auto;

      max-height: 48px;

      object-fit: contain;

      object-position: left center;

      filter:
        drop-shadow(
          0 0 18px rgba(36,87,255,0.13)
        );

      transition:
        filter 350ms var(--nq-ease),
        transform 350ms var(--nq-ease);
    }


    .nq-brand:hover .nq-brand-logo {

      transform:
        scale(1.015);

      filter:
        drop-shadow(
          0 0 24px rgba(36,87,255,0.24)
        )
        drop-shadow(
          0 0 12px rgba(139,92,246,0.14)
        );
    }


    /* =========================================================
       10. DESKTOP NAVIGATION
       ========================================================= */

    .nq-nav {

      display: flex;

      align-items: center;

      justify-content: center;

      flex: 1;

      height: 100%;
    }


    .nq-nav-list {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 4px;

      margin: 0;
      padding: 0;

      list-style: none;
    }


    .nq-nav-link {

      position: relative;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 42px;

      padding:
        0 13px;

      border-radius:
        11px;

      color:
        var(--nq-text-muted);

      font-size:
        13.5px;

      font-weight:
        600;

      letter-spacing:
        -0.01em;

      white-space:
        nowrap;

      transition:
        color var(--nq-transition),
        background var(--nq-transition),
        transform var(--nq-transition);
    }


    .nq-nav-link:hover {

      color:
        var(--nq-text);

      background:
        var(--nq-surface-soft);

      transform:
        translateY(-1px);
    }


    .nq-nav-link.is-active {

      color:
        var(--nq-text);

      background:
        rgba(255,255,255,0.045);
    }


    .nq-nav-link.is-active::after {

      content: "";

      position: absolute;

      left: 50%;

      bottom: 4px;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background:
        var(--nq-blue-bright);

      box-shadow:
        0 0 12px var(--nq-blue);
      
      transform:
        translateX(-50%);
    }


    /* Chevron */

    .nq-chevron {

      width: 13px;
      height: 13px;

      margin-left: 5px;

      opacity: 0.65;

      transition:
        transform 220ms var(--nq-ease);
    }


    .nq-nav-link:hover .nq-chevron {

      transform:
        translateY(2px);
    }


    /* =========================================================
       11. RIGHT ACTIONS
       ========================================================= */

    .nq-actions {

      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 7px;

      flex:
        0 0 auto;
    }


    /* Generic icon button */

    .nq-icon-btn {

      position: relative;

      width: 42px;
      height: 42px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      flex:
        0 0 auto;

      color:
        var(--nq-text-soft);

      background:
        transparent;

      border:
        1px solid transparent;

      border-radius:
        11px;

      cursor:
        pointer;

      transition:
        color var(--nq-transition),
        background var(--nq-transition),
        border-color var(--nq-transition),
        transform var(--nq-transition);
    }


    .nq-icon-btn:hover {

      color:
        var(--nq-text);

      background:
        var(--nq-surface-soft);

      border-color:
        var(--nq-border);

      transform:
        translateY(-1px);
    }


    .nq-icon-btn:active {

      transform:
        translateY(0)
        scale(0.96);
    }


    .nq-icon {

      width: 18px;
      height: 18px;

      display: block;

      stroke:
        currentColor;

      stroke-width:
        1.8;

      stroke-linecap:
        round;

      stroke-linejoin:
        round;

      fill:
        none;
    }


    /* =========================================================
       12. THEME TOGGLE
       ========================================================= */

    .nq-theme-icon-sun {
      display: none;
    }


    html[data-theme="light"] .nq-theme-icon-sun {
      display: block;
    }


    html[data-theme="light"] .nq-theme-icon-moon {
      display: none;
    }


    /* =========================================================
       13. EXPLORE BUTTON
       ========================================================= */

    .nq-explore-btn {

      position: relative;

      min-height: 42px;

      padding:
        0 17px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      overflow: hidden;

      border:
        1px solid rgba(102, 131, 255, 0.34);

      border-radius:
        11px;

      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          #2758ff 0%,
          #4b45e8 52%,
          #7849ed 100%
        );

      box-shadow:
        0 8px 24px rgba(36,87,255,0.18),
        inset 0 1px 0 rgba(255,255,255,0.16);

      font-size:
        13px;

      font-weight:
        700;

      letter-spacing:
        -0.01em;

      cursor:
        pointer;

      transition:
        transform var(--nq-transition),
        box-shadow var(--nq-transition);
    }


    .nq-explore-btn::before {

      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: -80%;

      width: 60%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.20),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left 650ms var(--nq-ease);
    }


    .nq-explore-btn:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 30px rgba(36,87,255,0.27),
        0 0 22px rgba(99,102,241,0.13),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }


    .nq-explore-btn:hover::before {
      left: 125%;
    }


    .nq-explore-btn:active {

      transform:
        translateY(0)
        scale(0.98);
    }


    .nq-explore-arrow {

      width: 15px;
      height: 15px;

      transition:
        transform 240ms var(--nq-ease);
    }


    .nq-explore-btn:hover .nq-explore-arrow {

      transform:
        translateX(3px);
    }


    /* =========================================================
       14. MOBILE MENU BUTTON
       ========================================================= */

    .nq-menu-btn {

      display: none;

      width: 42px;
      height: 42px;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 5px;

      border:
        1px solid transparent;

      border-radius:
        11px;

      background:
        transparent;

      color:
        var(--nq-text-soft);

      cursor:
        pointer;

      transition:
        background var(--nq-transition),
        border-color var(--nq-transition),
        color var(--nq-transition);
    }


    .nq-menu-btn:hover {

      background:
        var(--nq-surface-soft);

      border-color:
        var(--nq-border);

      color:
        var(--nq-text);
    }


    .nq-menu-line {

      width: 18px;
      height: 1.5px;

      border-radius: 999px;

      background:
        currentColor;

      transition:
        transform 280ms var(--nq-ease),
        opacity 180ms ease,
        width 280ms var(--nq-ease);
    }


    .nq-menu-btn.is-open .nq-menu-line:nth-child(1) {

      transform:
        translateY(6.5px)
        rotate(45deg);
    }


    .nq-menu-btn.is-open .nq-menu-line:nth-child(2) {

      opacity: 0;

      width: 0;
    }


    .nq-menu-btn.is-open .nq-menu-line:nth-child(3) {

      transform:
        translateY(-6.5px)
        rotate(-45deg);
    }


    /* =========================================================
       15. MOBILE NAV PANEL
       ========================================================= */

    .nq-mobile-panel {

      position: fixed;

      top: 94px;

      left: 20px;
      right: 20px;

      z-index: 990;

      padding:
        12px;

      border:
        1px solid var(--nq-border);

      border-radius:
        20px;

      background:
        rgba(7, 11, 27, 0.90);

      backdrop-filter:
        blur(26px)
        saturate(145%);

      -webkit-backdrop-filter:
        blur(26px)
        saturate(145%);

      box-shadow:
        0 24px 80px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.035);

      opacity: 0;

      visibility: hidden;

      transform:
        translateY(-12px)
        scale(0.98);

      transform-origin:
        top center;

      transition:
        opacity 240ms var(--nq-ease),
        visibility 240ms var(--nq-ease),
        transform 300ms var(--nq-ease);
    }


    html[data-theme="light"] .nq-mobile-panel {

      background:
        rgba(255,255,255,0.92);

      box-shadow:
        0 24px 80px rgba(26,35,65,0.15),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }


    .nq-mobile-panel.is-open {

      opacity: 1;

      visibility: visible;

      transform:
        translateY(0)
        scale(1);
    }


    .nq-mobile-links {

      display:
        flex;

      flex-direction:
        column;

      gap:
        3px;

      margin:
        0;

      padding:
        0;

      list-style:
        none;
    }


    .nq-mobile-link {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      min-height:
        52px;

      padding:
        0 14px;

      border-radius:
        12px;

      color:
        var(--nq-text-soft);

      font-size:
        14px;

      font-weight:
        600;

      transition:
        background var(--nq-transition),
        color var(--nq-transition),
        transform var(--nq-transition);
    }


    .nq-mobile-link:hover {

      color:
        var(--nq-text);

      background:
        var(--nq-surface-soft);

      transform:
        translateX(3px);
    }


    .nq-mobile-divider {

      height:
        1px;

      margin:
        8px 5px;

      background:
        var(--nq-border);
    }


    .nq-mobile-explore {

      width:
        100%;

      min-height:
        48px;

      margin-top:
        5px;
    }


    /* =========================================================
       16. MOBILE OVERLAY
       ========================================================= */

    .nq-menu-overlay {

      position: fixed;

      inset: 0;

      z-index: 980;

      background:
        rgba(0,0,0,0.38);

      backdrop-filter:
        blur(3px);

      -webkit-backdrop-filter:
        blur(3px);

      opacity:
        0;

      visibility:
        hidden;

      pointer-events:
        none;

      transition:
        opacity 250ms ease,
        visibility 250ms ease;
    }


    .nq-menu-overlay.is-visible {

      opacity:
        1;

      visibility:
        visible;

      pointer-events:
        auto;
    }


    /* =========================================================
       17. PART 1 CANVAS / FOUNDATION AREA
       ========================================================= */

    .nq-foundation {

      position:
        relative;

      min-height:
        100vh;

      padding-top:
        var(--nq-navbar-height);

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      overflow:
        hidden;
    }


    .nq-foundation-orb {

      position:
        absolute;

      width:
        420px;

      height:
        420px;

      border-radius:
        50%;

      background:
        radial-gradient(
          circle,
          rgba(36,87,255,0.08),
          transparent 68%
        );

      filter:
        blur(15px);

      pointer-events:
        none;

      animation:
        nqOrbFloat 10s ease-in-out infinite alternate;
    }


    @keyframes nqOrbFloat {

      0% {
        transform:
          translate3d(-80px, 30px, 0)
          scale(0.94);
      }

      100% {
        transform:
          translate3d(80px, -30px, 0)
          scale(1.06);
      }

    }


    .nq-foundation-copy {

      position:
        relative;

      z-index:
        2;

      width:
        min(680px, 100%);

      padding:
        60px 20px;

      text-align:
        center;

      opacity:
        1;
    }


    .nq-foundation-label {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      margin-bottom:
        20px;

      padding:
        8px 12px;

      border:
        1px solid var(--nq-border);

      border-radius:
        999px;

      color:
        var(--nq-text-muted);

      background:
        var(--nq-surface-soft);

      font-size:
        11px;

      font-weight:
        700;

      letter-spacing:
        0.12em;

      text-transform:
        uppercase;
    }


    .nq-foundation-dot {

      width:
        6px;

      height:
        6px;

      border-radius:
        50%;

      background:
        var(--nq-blue-bright);

      box-shadow:
        0 0 12px var(--nq-blue-bright);
    }


    .nq-foundation-title {

      margin:
        0;

      color:
        var(--nq-text);

      font-family:
        var(--nq-font-display);

      font-size:
        clamp(38px, 6vw, 72px);

      line-height:
        0.98;

      letter-spacing:
        -0.055em;

      font-weight:
        760;
    }


    .nq-foundation-title span {

      background:
        linear-gradient(
          100deg,
          #ffffff 5%,
          #b9c7ff 40%,
          #7c72ff 75%,
          #b06cff 100%
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color:
        transparent;
    }


    html[data-theme="light"] .nq-foundation-title span {

      background:
        linear-gradient(
          100deg,
          #11162c 5%,
          #3159db 45%,
          #6949d9 80%,
          #864edc 100%
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;
    }


    .nq-foundation-description {

      max-width:
        580px;

      margin:
        24px auto 0;

      color:
        var(--nq-text-muted);

      font-size:
        15px;

      line-height:
        1.75;
    }


    .nq-foundation-line {

      width:
        min(420px, 80%);

      height:
        1px;

      margin:
        34px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--nq-border-strong),
          transparent
        );
    }


    /* =========================================================
       18. RESPONSIVE — TABLET
       ========================================================= */

    @media (max-width: 1080px) {

      .nq-navbar {
        gap: 10px;
      }

      .nq-brand {
        min-width: 145px;
      }

      .nq-brand-logo {
        width: 142px;
      }

      .nq-nav-link {
        padding-inline: 9px;
        font-size: 12.5px;
      }

      .nq-actions {
        gap: 3px;
      }

      .nq-explore-btn {
        padding-inline: 13px;
      }

    }


    /* =========================================================
       19. RESPONSIVE — MOBILE
       ========================================================= */

    @media (max-width: 820px) {

      :root {
        --nq-navbar-height: 70px;
      }


      .nq-navbar-wrap {
        padding:
          10px 12px;
      }


      .nq-navbar {

        height:
          64px;

        padding:
          0 10px 0 14px;

        border-radius:
          17px;
      }


      .nq-navbar.is-scrolled {

        height:
          60px;
      }


      .nq-brand {

        min-width:
          0;

        height:
          44px;
      }


      .nq-brand-logo {

        width:
          132px;

        max-height:
          42px;
      }


      .nq-nav {
        display:
          none;
      }


      .nq-actions {

        margin-left:
          auto;

        gap:
          2px;
      }


      .nq-actions .nq-explore-btn {
        display:
          none;
      }


      .nq-menu-btn {
        display:
          inline-flex;
      }


      .nq-icon-btn {
        width:
          40px;

        height:
          40px;
      }


      .nq-mobile-panel {

        top:
          82px;

        left:
          12px;

        right:
          12px;
      }


      .nq-foundation {

        min-height:
          100svh;

        padding-top:
          70px;
      }


      .nq-foundation-copy {
        padding:
          50px 16px;
      }

    }


    /* =========================================================
       20. RESPONSIVE — SMALL PHONES
       ========================================================= */

    @media (max-width: 430px) {

      .nq-navbar {
        padding-left:
          10px;

        padding-right:
          7px;
      }


      .nq-brand-logo {
        width:
          119px;
      }


      .nq-brand {
        height:
          40px;
      }


      .nq-icon-btn,
      .nq-menu-btn {
        width:
          38px;

        height:
          38px;
      }


      .nq-icon {
        width:
          17px;

        height:
          17px;
      }


      .nq-foundation-title {
        font-size:
          clamp(34px, 11vw, 48px);
      }


      .nq-foundation-description {
        font-size:
          14px;

        line-height:
          1.7;
      }

    }


    /* =========================================================
       21. REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior:
          auto;
      }


      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }

    }

  </style>
</head>


<body>

  <!-- =========================================================
       GLOBAL BACKGROUND
       ========================================================= -->

  <div
    class="nq-background"
    aria-hidden="true"
  ></div>

  <div
    class="nq-grid"
    aria-hidden="true"
  ></div>


  <!-- =========================================================
       MOBILE MENU OVERLAY
       ========================================================= -->

  <div
    class="nq-menu-overlay"
    id="nqMenuOverlay"
    aria-hidden="true"
  ></div>


  <!-- =========================================================
       NAVBAR
       ========================================================= -->

  <header class="nq-navbar-wrap">

    <nav
      class="nq-navbar"
      id="nqNavbar"
      aria-label="Primary navigation"
    >

      <!-- BRAND -->

      <a
        href="#top"
        class="nq-brand"
        aria-label="Nuvoraq home"
      >

        <img
          src="nuvoraq-logo.png"
          alt="Nuvoraq"
          class="nq-brand-logo"
        >

      </a>


      <!-- DESKTOP NAV -->

      <div class="nq-nav">

        <ul class="nq-nav-list">

          <li>
            <a
              href="#tools"
              class="nq-nav-link is-active"
            >
              Tools
            </a>
          </li>


          <li>
            <a
              href="#categories"
              class="nq-nav-link"
            >
              Categories

              <svg
                class="nq-chevron"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="m6 9 6 6 6-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

            </a>
          </li>


          <li>
            <a
              href="#ai-tools"
              class="nq-nav-link"
            >
              AI Tools
            </a>
          </li>


          <li>
            <a
              href="#resources"
              class="nq-nav-link"
            >
              Resources

              <svg
                class="nq-chevron"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="m6 9 6 6 6-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

            </a>
          </li>

        </ul>

      </div>


      <!-- RIGHT ACTIONS -->

      <div class="nq-actions">

        <!-- SEARCH -->

        <button
          type="button"
          class="nq-icon-btn"
          id="nqSearchButton"
          aria-label="Search Nuvoraq"
          title="Search"
        >

          <svg
            class="nq-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
            />

            <path
              d="m16 16 4.2 4.2"
            />
          </svg>

        </button>


        <!-- THEME -->

        <button
          type="button"
          class="nq-icon-btn"
          id="nqThemeButton"
          aria-label="Toggle color theme"
          title="Toggle theme"
        >

          <!-- Moon -->

          <svg
            class="nq-icon nq-theme-icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M20.2 15.4A8.3 8.3 0 0 1 8.6 3.8 8.4 8.4 0 1 0 20.2 15.4Z"
            />

          </svg>


          <!-- Sun -->

          <svg
            class="nq-icon nq-theme-icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="12"
              r="3.5"
            />

            <path
              d="
                M12 2v2
                M12 20v2
                M4.93 4.93l1.42 1.42
                M17.65 17.65l1.42 1.42
                M2 12h2
                M20 12h2
                M4.93 19.07l1.42-1.42
                M17.65 6.35l1.42-1.42
              "
            />

          </svg>

        </button>


        <!-- DESKTOP EXPLORE -->

        <button
          type="button"
          class="nq-explore-btn"
          id="nqExploreButton"
        >

          <span>
            Explore Tools
          </span>

          <svg
            class="nq-explore-arrow"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M5 12h13"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="m13 6 6 6-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </button>


        <!-- MOBILE MENU -->

        <button
          type="button"
          class="nq-menu-btn"
          id="nqMenuButton"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="nqMobilePanel"
        >

          <span class="nq-menu-line"></span>
          <span class="nq-menu-line"></span>
          <span class="nq-menu-line"></span>

        </button>

      </div>

    </nav>

  </header>


  <!-- =========================================================
       MOBILE NAVIGATION PANEL
       ========================================================= -->

  <div
    class="nq-mobile-panel"
    id="nqMobilePanel"
    aria-hidden="true"
  >

    <ul class="nq-mobile-links">

      <li>
        <a
          href="#tools"
          class="nq-mobile-link"
        >
          <span>Tools</span>

          <span aria-hidden="true">→</span>
        </a>
      </li>


      <li>
        <a
          href="#categories"
          class="nq-mobile-link"
        >
          <span>Categories</span>

          <span aria-hidden="true">→</span>
        </a>
      </li>


      <li>
        <a
          href="#ai-tools"
          class="nq-mobile-link"
        >
          <span>AI Tools</span>

          <span aria-hidden="true">→</span>
        </a>
      </li>


      <li>
        <a
          href="#resources"
          class="nq-mobile-link"
        >
          <span>Resources</span>

          <span aria-hidden="true">→</span>
        </a>
      </li>

    </ul>


    <div class="nq-mobile-divider"></div>


    <button
      type="button"
      class="nq-explore-btn nq-mobile-explore"
      id="nqMobileExploreButton"
    >

      <span>
        Explore Tools
      </span>

      <svg
        class="nq-explore-arrow"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M5 12h13"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="m13 6 6 6-6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

      </svg>

    </button>

  </div>


  <!-- =========================================================
       MAIN FOUNDATION
       PART 1 VISUAL TEST AREA
       ========================================================= -->

  <main id="top">

    <section
      class="nq-foundation"
      id="tools"
    >

      <div
        class="nq-foundation-orb"
        aria-hidden="true"
      ></div>


      <div class="nq-foundation-copy">

        <div class="nq-foundation-label">

          <span
            class="nq-foundation-dot"
            aria-hidden="true"
          ></span>

          Nuvoraq is taking shape

        </div>


        <h1 class="nq-foundation-title">

          Powerful tools.
          <br>

          <span>
            One simple workspace.
          </span>

        </h1>


        <p class="nq-foundation-description">

          A premium foundation for Nuvoraq's free online tools —
          built to be fast, simple, private and accessible everywhere.

        </p>


        <div
          class="nq-foundation-line"
          aria-hidden="true"
        ></div>

      </div>

    </section>


    <!-- =======================================================
         FUTURE SECTION ANCHORS
         These are temporary and will be replaced in later parts.
         ======================================================= -->

    <div id="categories"></div>
    <div id="ai-tools"></div>
    <div id="resources"></div>

  </main>


  <!-- =========================================================
       JAVASCRIPT — PART 1
       ========================================================= -->

  <script>

    (() => {

      "use strict";


      /* =======================================================
         ELEMENTS
         ======================================================= */

      const html =
        document.documentElement;

      const navbar =
        document.getElementById("nqNavbar");

      const themeButton =
        document.getElementById("nqThemeButton");

      const menuButton =
        document.getElementById("nqMenuButton");

      const mobilePanel =
        document.getElementById("nqMobilePanel");

      const menuOverlay =
        document.getElementById("nqMenuOverlay");

      const searchButton =
        document.getElementById("nqSearchButton");

      const exploreButton =
        document.getElementById("nqExploreButton");

      const mobileExploreButton =
        document.getElementById("nqMobileExploreButton");


      /* =======================================================
         SCROLL NAVBAR
         ======================================================= */

      const updateNavbar =
        () => {

          if (!navbar) {
            return;
          }

          if (window.scrollY > 24) {

            navbar.classList.add(
              "is-scrolled"
            );

          } else {

            navbar.classList.remove(
              "is-scrolled"
            );

          }

        };


      updateNavbar();


      window.addEventListener(
        "scroll",
        updateNavbar,
        {
          passive: true
        }
      );


      /* =======================================================
         THEME
         ======================================================= */

      const getStoredTheme =
        () => {

          try {

            return localStorage.getItem(
              "nuvoraq-theme"
            );

          } catch (error) {

            return null;

          }

        };


      const systemPrefersLight =
        window.matchMedia &&
        window.matchMedia(
          "(prefers-color-scheme: light)"
        ).matches;


      const storedTheme =
        getStoredTheme();


      const initialTheme =
        storedTheme ||
        (systemPrefersLight ? "light" : "dark");


      html.setAttribute(
        "data-theme",
        initialTheme
      );


      const saveTheme =
        (theme) => {

          try {

            localStorage.setItem(
              "nuvoraq-theme",
              theme
            );

          } catch (error) {

            /* Storage can be unavailable.
               Theme still works for this session. */

          }

        };


      const setTheme =
        (theme) => {

          html.setAttribute(
            "data-theme",
            theme
          );

          saveTheme(theme);

        };


      themeButton?.addEventListener(
        "click",
        () => {

          const currentTheme =
            html.getAttribute(
              "data-theme"
            );

          const nextTheme =
            currentTheme === "light"
              ? "dark"
              : "light";

          setTheme(nextTheme);

        }
      );


      /* =======================================================
         MOBILE MENU
         ======================================================= */

      const setMenuState =
        (open) => {

          if (!menuButton ||
              !mobilePanel ||
              !menuOverlay) {
            return;
          }


          menuButton.classList.toggle(
            "is-open",
            open
          );


          mobilePanel.classList.toggle(
            "is-open",
            open
          );


          menuOverlay.classList.toggle(
            "is-visible",
            open
          );


          menuButton.setAttribute(
            "aria-expanded",
            String(open)
          );


          mobilePanel.setAttribute(
            "aria-hidden",
            String(!open)
          );


          menuOverlay.setAttribute(
            "aria-hidden",
            String(!open)
          );


          document.body.classList.toggle(
            "menu-open",
            open
          );

        };


      const toggleMenu =
        () => {

          const isOpen =
            menuButton?.classList.contains(
              "is-open"
            );

          setMenuState(!isOpen);

        };


      menuButton?.addEventListener(
        "click",
        toggleMenu
      );


      menuOverlay?.addEventListener(
        "click",
        () => {
          setMenuState(false);
        }
      );


      /* Close mobile menu
         after selecting a link */

      document
        .querySelectorAll(".nq-mobile-link")
        .forEach((link) => {

          link.addEventListener(
            "click",
            () => {
              setMenuState(false);
            }
          );

        });


      /* Close menu with Escape */

      document.addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Escape"
          ) {

            setMenuState(false);

          }

        }
      );


      /* =======================================================
         SEARCH BUTTON
         ======================================================= */

      searchButton?.addEventListener(
        "click",
        () => {

          /*
           * Full Smart Search arrives in Part 6.
           * For now this gives the user a clear response
           * without pretending search already exists.
           */

          const message =
            "Nuvoraq Search is coming in Part 6.";

          window.dispatchEvent(
            new CustomEvent(
              "nuvoraq:search-request",
              {
                detail: {
                  message
                }
              }
            )
          );


          /*
           * Temporary visual feedback.
           */

          searchButton.animate(
            [
              {
                transform:
                  "scale(1)"
              },
              {
                transform:
                  "scale(0.90)"
              },
              {
                transform:
                  "scale(1)"
              }
            ],
            {
              duration: 260,
              easing:
                "cubic-bezier(.22,1,.36,1)"
            }
          );

        }
      );


      /* =======================================================
         EXPLORE BUTTON
         ======================================================= */

      const handleExplore =
        () => {

          const toolsSection =
            document.getElementById(
              "tools"
            );

          toolsSection?.scrollIntoView({
            behavior:
              window.matchMedia(
                "(prefers-reduced-motion: reduce)"
              ).matches
                ? "auto"
                : "smooth"
          });

        };


      exploreButton?.addEventListener(
        "click",
        handleExplore
      );


      mobileExploreButton?.addEventListener(
        "click",
        () => {

          setMenuState(false);

          handleExplore();

        }
      );


      /* =======================================================
         PREVENT DEAD MOBILE LINKS
         ======================================================= */

      document
        .querySelectorAll(
          '.nq-nav-link[href^="#"], .nq-mobile-link[href^="#"]'
        )
        .forEach((link) => {

          link.addEventListener(
            "click",
            (event) => {

              const targetId =
                link
                  .getAttribute("href")
                  ?.replace("#", "");

              if (!targetId) {
                return;
              }

              const target =
                document.getElementById(
                  targetId
                );

              if (!target) {
                return;
              }


              event.preventDefault();


              target.scrollIntoView({
                behavior:
                  window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                  ).matches
                    ? "auto"
                    : "smooth"
              });

            }
          );

        });


      /* =======================================================
         ACTIVE NAV LINK
         ======================================================= */

      const navLinks =
        document.querySelectorAll(
          ".nq-nav-link"
        );


      navLinks.forEach(
        (link) => {

          link.addEventListener(
            "click",
            () => {

              navLinks.forEach(
                (item) => {

                  item.classList.remove(
                    "is-active"
                  );

                }
              );


              link.classList.add(
                "is-active"
              );

            }
          );

        }
      );


      /* =======================================================
         DEV-SAFE ERROR MONITOR
         ======================================================= */

      window.Nuvoraq =
        window.Nuvoraq || {};


      window.Nuvoraq.version =
        "0.1.0";


      window.Nuvoraq.part =
        "Part 1";


      /*
       * This doesn't display errors to users.
       * It simply makes the current build identifiable
       * while we develop future parts.
       */

      window.Nuvoraq.ready =
        true;


    })();

  </script>

</body>
</html>
